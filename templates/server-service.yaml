apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 2283
      targetPort: 2283
      name: http
  selector:
    app: {{ .Release.Name }}-server

---

apiVersion: v1
kind: Service
metadata:
  name: immich-server-ext
  namespace: immich
  labels:
    io.cilium/loadbalancer-mode: "l2"
    app: "immich-server"
  annotations:
    lbipam.cilium.io/ips: "192.168.1.125"
spec:
  type: LoadBalancer
  ports:
    - port: 2283
      targetPort: 2283
      protocol: TCP
  selector:
    app.kubernetes.io/name: immich-server

