apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 2283
      targetPort: 2283
      name: http
  selector:
    app: {{ .Release.Name }}-server

---

apiVersion: v1
kind: Service
metadata:
  name: immich-server-ext
  namespace: immich
spec:
  type: NodePort
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283