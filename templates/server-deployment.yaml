apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          #command: ["node"]
          #args: ["/usr/src/app/dist/main.js", "immich"]
          env:
            # --- FORCE BIND TO ALL INTERFACES AND CORRECT PORT ---
            - name: IMMICH_APP
              value: "immich"
            - name: IMMICH_HOST
              value: "0.0.0.0"
            - name: IMMICH_PORT
              value: "2283"
            # -----------------------------------------------------
            - name: DB_HOSTNAME
              value: "{{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_DATABASE_NAME
            - name: REDIS_HOSTNAME
              value: "{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://{{ .Release.Name }}-machine-learning.{{ .Release.Namespace }}.svc.cluster.local:3003"
          ports:
            - containerPort: 2283
              name: http
          volumeMounts:
            - name: immich-upload
              mountPath: /usr/src/app/upload
      volumes:
        - name: immich-upload
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-upload-pvc